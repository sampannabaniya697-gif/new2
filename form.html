<html>
    <head><title>FORM</title>
    <link href="lmc.png" rel="icon" type="image/png"></head>
    <body>
        <main><b>Here, the tags are used in HTML to design a form using table i.e. tabular form.</b></main>
        <br>
        <table border="1" align="center">
            <thead>
                <th>
                    <tr>Name:</tr>
                    <tr>Email:</tr>
                    <tr>Gender:</tr>
                    <tr>Address:</tr>
                    <tr>Code number:</tr>
                    <tr>Blood Group:</tr>
                    <tr>Phone number:</tr>
                    <tr colspan="2">
                        <form>
                            <input type="button" placeholder="SUBMIT">
                            <input type="reset" value="clear form" name="reset">Reset
                        </form>
                    </tr>
                </th>
            </thead>
            <tbody>
                <td>
                    <form>
                        <tr><input type="text" placeholder="eg:ABC" name="username"></tr>
                        <tr><input type="email" placeholder="eg:abc@gmail.com" name="emails"></tr>
                        <tr><input type="radio" value="Male">Male
                            <input type="radio" value="Female">Female
                            <input type="radio" value="Other">Other
                        </tr>
                        <tr><input type="text" placeholder="eg:abc"></tr>
                        <tr><input type="number" name="number" value="number"></tr>
                        <tr><input type="text" placeholder="eg:A+"></tr>
                        <tr><input type="text" placeholder="eg:9841xxxxxx" name="ph no."></tr>
                    </form>
                </td>
            </tbody>
        </table>
        <br>
        <caption align="center"> Fill up the form and Submit</caption>
        <br>
        <hr>
        <p>Thank You for filing up the form. You will be shortly notified.</p>
        <br>
        Now, you can go back to <a href="index.html">INDEX</a>Byee!!
    </body>
</html>
